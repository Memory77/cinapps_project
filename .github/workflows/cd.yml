name: 🚀 CD - Deploy to VPS

on:
  push:
    branches: [ main ]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔐 Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /appli/project/cinapps_project || mkdir -p /appli/project/cinapps_project && cd /appli/project/cinapps_project

            # Si le repo n'est pas cloné, clone initial depuis GitHub
            if [ ! -d .git ]; then
              git clone https://github.com/Memory77/cinapps_project .
            fi

            # MAJ code -> état exact de origin/main
            git fetch --all
            git reset --hard origin/main

            # Stop propre, puis rebuild & restart
            docker compose down || true
            docker compose up -d --build

            # (optionnel) petit ménage
            docker system prune -f || true
          EOF
