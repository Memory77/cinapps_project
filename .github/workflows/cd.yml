name: 🚀 CD - Déploiement sur VPS

on:
  push:
    branches:
      - main   # Se lance uniquement quand un merge/push sur main

jobs:
  deploy:
    name: 🚀 Déploiement VPS
    runs-on: ubuntu-latest

    steps:
    - name: 🔐 Setup SSH agent
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 🚀 Pull & Rebuild sur VPS
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          
          # Aller dans le dossier ou le créer
          if [ ! -d /appli/project/cinapps_project ]; then
            mkdir -p /appli/project/cinapps_project
            cd /appli/project/cinapps_project
            git clone https://github.com/Memory77/cinapps_project .
          else
            cd /appli/project/cinapps_project
            git fetch --all
            git reset --hard origin/main
          fi
          
          # Rebuild et restart propre
          docker compose down || true
          docker compose up -d --build
          
          # Nettoyage
          docker system prune -f || true
        EOF
