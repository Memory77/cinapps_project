name: 🚀 CD - Déploiement vers Azure (semi-auto)

on:
  workflow_run:
    workflows: ["🚀 CI - Build & Push vers Docker Hub"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v3

      - name: 🔐 Récupérer les secrets GitHub
        run: |
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_ENV
          echo "DOCKERHUB_PASSWORD=${{ secrets.DOCKERHUB_TOKEN }}" >> $GITHUB_ENV
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> $GITHUB_ENV
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> $GITHUB_ENV
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> $GITHUB_ENV
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "ALGORITHM=${{ secrets.ALGORITHM }}" >> $GITHUB_ENV
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" >> $GITHUB_ENV
          echo "DEBUG=${{ secrets.DEBUG }}" >> $GITHUB_ENV
          echo "API_CRUD_USERNAME=${{ secrets.API_CRUD_USERNAME }}" >> $GITHUB_ENV
          echo "API_CRUD_PASSWORD=${{ secrets.API_CRUD_PASSWORD }}" >> $GITHUB_ENV
          echo "URL_API=${{ secrets.URL_API }}" >> $GITHUB_ENV

      - name: 🧪 Installer Azure CLI
        uses: azure/setup-azure@v3
        with:
          client-id: ${{ secrets.AZURE_USERNAME }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_PASSWORD }}

      - name: 🚀 Lancer le script de déploiement
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
