name: 🚀 CD - Déploiement vers Azure (semi-auto)

on:
  workflow_dispatch:  # tu déclenches manuellement depuis GitHub

jobs:
  deploy:
    name: 🔧 Déploiement manuel sur Azure
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      AZURE_USERNAME: ${{ secrets.AZURE_USERNAME }}
      AZURE_PASSWORD: ${{ secrets.AZURE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3

      - name: ⚙️ Installe Azure CLI
        uses: azure/setup-azure@v3

      - name: 🔐 Connexion à Azure
        run: |
          az login --username "$AZURE_USERNAME" \
                   --password "$AZURE_PASSWORD" \
                   --tenant "$AZURE_TENANT_ID"

      - name: 📦 Lancer le script de déploiement
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
