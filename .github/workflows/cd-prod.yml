name: ✅ CI + 🚀 CD - Tests & Déploiement

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ✅ Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: 📁 Checkout repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Install API_s dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r API_s/requirements.txt

    - name: 🧪 Run pytest on API_s
      run: |
        pytest API_s/tests.py

    - name: 📦 Install cinapps dependencies
      run: |
        pip install -r cinapps/requirements.txt

    - name: 🧪 Run Django tests
      run: |
        cd cinapps
        python manage.py test

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: test  # Ne se lance QUE si les tests passent

    steps:
    - name: 🔐 Setup SSH agent
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 🚀 Deploy Docker Compose
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd /appli/project/cinapps_project
          docker compose -f docker-compose.yml up -d --build
        EOF
