name: CI Prod - Build, Test & Deploy (staging)

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    env:
      MYSQL_USER: ${{ secrets.MYSQL_USER }}
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
      MYSQL_HOST: db
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ALGORITHM: ${{ secrets.ALGORITHM }}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      URL_API: ${{ secrets.URL_API }}
      API_CRUD_URL: ${{ secrets.API_CRUD_URL }}
      API_CRUD_USERNAME: ${{ secrets.API_CRUD_USERNAME }}
      API_CRUD_PASSWORD: ${{ secrets.API_CRUD_PASSWORD }}
      DEBUG: 'False'
      MYSQL_PORT: '3306'
      MYSQL_RDY: 'ready'

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create .env file for docker-compose
        run: |
          echo "MYSQL_USER=${MYSQL_USER}" >> .env
          echo "MYSQL_PASSWORD=${MYSQL_PASSWORD}" >> .env
          echo "MYSQL_DATABASE=${MYSQL_DATABASE}" >> .env
          echo "MYSQL_HOST=${MYSQL_HOST}" >> .env
          echo "SECRET_KEY=${SECRET_KEY}" >> .env
          echo "ALGORITHM=${ALGORITHM}" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}" >> .env
          echo "DATABASE_URL=${DATABASE_URL}" >> .env
          echo "URL_API=${URL_API}" >> .env
          echo "API_CRUD_URL=${API_CRUD_URL}" >> .env
          echo "API_CRUD_USERNAME=${API_CRUD_USERNAME}" >> .env
          echo "API_CRUD_PASSWORD=${API_CRUD_PASSWORD}" >> .env
          echo "DEBUG=${DEBUG}" >> .env
          echo "MYSQL_PORT=${MYSQL_PORT}" >> .env
          echo "MYSQL_RDY=${MYSQL_RDY}" >> .env

      - name: Build and start containers
        run: docker-compose -f docker-compose.prod.yml up -d --build

      - name: Wait for services to be ready
        run: sleep 20

      - name: Run API integration tests
        run: pytest API_s/test_api_integration.py

      - name: Run Django tests
        run: |
          docker exec -t $(docker ps -qf "name=cinapps") python manage.py test

      - name: Stop containers
        run: docker-compose -f docker-compose.prod.yml down

      - name: Remove .env file
        run: rm .env
