name: ✨ Run Full Mocked Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies for API_s
      run: |
        python -m pip install --upgrade pip
        pip install -r API_s/requirements.txt

    - name: Run mocked integration tests in API_s
      run: |
        pytest API_s/tests.py

    - name: Install dependencies for Django (cinapps)
      run: |
        pip install -r cinapps/requirements.txt

    - name: Run mocked Django unit tests
      run: |
        cd cinapps
        python manage.py test