name: 🚀 CI - PROD Docker Compose + Tests

on:
  push:
    branches:
      - main  # ou une autre branche prod si tu préfères

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 📝 Create .env file for Docker Compose
        run: |
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "ALGORITHM=${{ secrets.ALGORITHM }}" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" >> .env
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "MYSQL_USER=${{ secrets.MYSQL_USER }}" >> .env
          echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}" >> .env
          echo "MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}" >> .env
          echo "MYSQL_HOST=${{ secrets.MYSQL_HOST }}" >> .env
          echo "MYSQL_PORT=${{ secrets.MYSQL_PORT }}" >> .env
          echo "MYSQL_RDY=${{ secrets.MYSQL_RDY }}" >> .env
          echo "DEBUG=${{ secrets.DEBUG }}" >> .env
          echo "API_CRUD_URL=${{ secrets.API_CRUD_URL }}" >> .env
          echo "API_CRUD_USERNAME=${{ secrets.API_CRUD_USERNAME }}" >> .env
          echo "API_CRUD_PASSWORD=${{ secrets.API_CRUD_PASSWORD }}" >> .env
          echo "URL_API=${{ secrets.URL_API }}" >> .env

      - name: 🛠️ Build & start containers
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: 🕐 Wait for services to be ready
        run: sleep 15

      - name: 🧪 Run API integration tests
        run: docker compose exec -T api_prediction pytest API_s/test_api_integration.py

      - name: 🧪 Run Django tests
        run: docker compose exec -T cinapps python manage.py test

      - name: 🛑 Stop containers
        run: docker compose -f docker-compose.prod.yml down

      - name: 🧹 Remove .env file
        run: rm .env
